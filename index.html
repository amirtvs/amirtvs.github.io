<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>مینی اپ تست PDF</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" type="text/css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
    body {
        font-family: 'Vazir', sans-serif;
        direction: rtl;
        background: #f0f0f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 30px;
    }
    h2 {
        margin-bottom: 20px;
    }
    table {
        border-collapse: collapse;
        margin-bottom: 20px;
        background: #fff;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    th, td {
        border: 1px solid #ccc;
        padding: 10px 15px;
        text-align: center;
    }
    th {
        background: #4CAF50;
        color: white;
    }
    button {
        padding: 12px 25px;
        background: #4CAF50;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
    }
    button:hover {
        background: #45a049;
    }
</style>
</head>
<body>

<h2>تست ساخت PDF</h2>

<table id="myTable">
    <tr>
        <th>نام</th>
        <th>سن</th>
        <th>شهر</th>
    </tr>
    <tr>
        <td>امیر</td>
        <td>30</td>
        <td>تهران</td>
    </tr>
    <tr>
        <td>مریم</td>
        <td>28</td>
        <td>اصفهان</td>
    </tr>
</table>

<button onclick="generatePDF()">ساخت PDF و دانلود</button>

<script>
async function generatePDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({orientation: "portrait", unit: "pt", format: "a4"});

    // فونت وزیر رو اضافه میکنیم
    const fontUrl = "https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/Vazir-Regular.ttf";
    const fontName = "Vazir";

    // Fetch فونت و اضافه کردن به jsPDF
    const fontBuffer = await fetch(fontUrl).then(r => r.arrayBuffer());
    doc.addFileToVFS("Vazir-Regular.ttf", fontBuffer);
    doc.addFont("Vazir-Regular.ttf", fontName, "normal");
    doc.setFont(fontName);

    let startY = 50;
    const table = document.getElementById("myTable");

    for (let i = 0; i < table.rows.length; i++) {
        let row = table.rows[i];
        let x = 50;
        for (let j = row.cells.length - 1; j >= 0; j--) { // RTL
            let cellText = row.cells[j].innerText;
            doc.text(cellText, x, startY);
            x += 150;
        }
        startY += 30;
    }

    doc.save("table.pdf");
}
</script>

</body>
</html>
